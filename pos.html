<!DOCTYPE html>
<html lang="fa-AF" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابیمان POS | HesabiMan</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style id="pageStyle">@media print{@page{size:A4;margin:13mm}}</style>
<style>
:root{
  --bg:#eef1f7; --bg2:#e4e9f2;
  --surface:#ffffff; --surface2:#f6f8fc; --surface3:#eef2f8;
  --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --primary:#0ea371; --primary2:#067a55; --primary-soft:#e6f7f0;
  --accent:#f59e0b; --accent-soft:#fef3e2;
  --danger:#e02424; --danger-soft:#fee9e9;
  --info:#2563eb; --info-soft:#e8effd;
  --purple:#7c3aed; --purple-soft:#f1eafd;
  --nav:#0f1b33; --nav2:#16294d;
  --r:18px;
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
  --sh-md:0 6px 18px -6px rgba(16,24,40,.12),0 2px 6px -2px rgba(16,24,40,.06);
  --sh-lg:0 24px 48px -16px rgba(16,24,40,.25);
  --glow:0 8px 24px -6px rgba(14,163,113,.45);
}
[data-theme="dark"]{
  --bg:#0b1120; --bg2:#0e1526;
  --surface:#141d31; --surface2:#182238; --surface3:#1d2a44;
  --text:#e8edf7; --muted:#8fa0bd; --line:#24304c;
  --primary-soft:#0d2b22; --accent-soft:#2b2110; --danger-soft:#2b1214;
  --info-soft:#12203d; --purple-soft:#221639;
  --sh-sm:0 1px 2px rgba(0,0,0,.3);
  --sh-md:0 8px 20px -6px rgba(0,0,0,.45);
  --sh-lg:0 24px 48px -16px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,rgba(14,163,113,.07),transparent 40%),radial-gradient(circle at 85% 100%,rgba(37,99,235,.06),transparent 40%);}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,163,113,.13)}
input[type="checkbox"]{width:auto;accent-color:var(--primary);width:17px;height:17px;cursor:pointer}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}
#app{display:flex;min-height:100vh}
.sidebar{width:250px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#dbe4f5;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;box-shadow:-8px 0 30px rgba(2,8,23,.25);z-index:40}
.logo{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.logo-cube{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#12c98b,#067a55);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px rgba(14,163,113,.5),inset 0 2px 0 rgba(255,255,255,.35);transform:perspective(200px) rotateX(8deg)}
.logo b{font-size:17px;color:#fff;display:block}.logo small{font-size:11px;color:#8fa3c8}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border-radius:13px;background:transparent;color:#a9bad9;font-size:14px;font-weight:600;margin-bottom:6px;transition:.22s;text-align:right}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(-3px)}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px -4px rgba(14,163,113,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.side-foot{margin-top:auto}
.reg-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.reg-box small{color:#8fa3c8;font-size:11px}.reg-box b{display:block;font-size:19px;color:#34d399;margin-top:3px}
.reg-box .sh{display:block;font-size:10px;color:#7dd3b0;margin-top:4px}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s;border:1px solid transparent}
.user-chip:hover{border-color:rgba(52,211,153,.5)}
.user-chip .av{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#d97706);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 10px rgba(245,158,11,.4)}
.user-chip b{font-size:13px;color:#fff;display:block}.user-chip small{font-size:11px;color:#8fa3c8}
.user-chip .sw{margin-inline-start:auto;font-size:14px;opacity:.7}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 22px;background:color-mix(in srgb,var(--surface) 75%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:var(--sh-sm);flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:800}
.topbar h1 small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.search-wrap{flex:1;max-width:380px;position:relative}
.search-wrap input{padding-inline-start:40px;border-radius:99px;background:var(--surface);box-shadow:var(--sh-sm)}
.search-wrap .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);opacity:.5}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--surface);box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.5);font-size:18px;display:grid;place-items:center;transition:.2s;color:var(--text)}
.icon-btn:active{transform:translateY(2px) scale(.96);box-shadow:var(--sh-sm)}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-6px;inset-inline-start:-6px;min-width:21px;height:21px;border-radius:99px;background:linear-gradient(135deg,#f43f5e,#e02424);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 3px 8px rgba(224,36,36,.5)}
.lang-sel{width:auto!important;padding:9px 12px!important;border-radius:99px!important;font-weight:800;font-size:12.5px;background:var(--surface);box-shadow:var(--sh-sm);cursor:pointer}
.page{display:none;padding:22px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.page.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.99)}}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg)));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.55);padding:18px}
[data-theme="dark"] .card{box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:13px;font-size:14px;font-weight:700;transition:.18s;color:var(--text);background:var(--surface);box-shadow:var(--sh-md)}
.btn:active{transform:translateY(2px);box-shadow:var(--sh-sm)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn-3d{background:linear-gradient(180deg,#14c586,var(--primary2));color:#fff;box-shadow:0 5px 0 #045c40,var(--glow)}
.btn-3d:hover{filter:brightness(1.06)}
.btn-3d:active{transform:translateY(4px);box-shadow:0 1px 0 #045c40}
.btn-amber{background:linear-gradient(180deg,#fbbf24,#d97706);color:#fff;box-shadow:0 5px 0 #92510a,0 8px 20px -6px rgba(245,158,11,.5)}
.btn-amber:active{transform:translateY(4px);box-shadow:0 1px 0 #92510a}
.btn-ghost{background:var(--surface2);box-shadow:none;border:1.5px solid var(--line)}
.btn-danger{background:linear-gradient(180deg,#f05252,#c81e1e);color:#fff;box-shadow:0 4px 0 #8f1414,0 8px 18px -6px rgba(224,36,36,.45)}
.btn-danger:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1414}
.btn-blue{background:linear-gradient(180deg,#60a5fa,#1d4ed8);color:#fff;box-shadow:0 4px 0 #1e3a8a,0 8px 18px -6px rgba(37,99,235,.45)}
.btn-blue:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.expTypeBtn{opacity:.45;transition:.2s;flex:1}
.expTypeBtn.on{opacity:1}
.pos-grid{display:grid;grid-template-columns:1fr 370px;gap:20px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.biz-bar{display:flex;flex-wrap:wrap;gap:10px}
.biz-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:13px;background:var(--surface2);border:1.5px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;transition:.18s;color:var(--text);box-shadow:var(--sh-sm)}
.biz-chip:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.biz-chip.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:var(--primary2);box-shadow:0 5px 14px -4px rgba(14,163,113,.5)}
.biz-chip .cnt{font-size:10.5px;font-weight:800;opacity:.7;background:rgba(15,23,42,.07);padding:1px 7px;border-radius:99px}
[data-theme="dark"] .biz-chip .cnt{background:rgba(255,255,255,.12)}
.biz-chip.on .cnt{background:rgba(255,255,255,.25);opacity:1}
.collapsible{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.55);margin-bottom:14px;overflow:hidden}
[data-theme="dark"] .collapsible{box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.05)}
.coll-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--surface2);user-select:none}
.coll-title{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px}
.coll-arrow{width:28px;height:28px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.collapsible.collapsed .coll-arrow{transform:rotate(180deg)}
.coll-body{padding:11px 12px 12px}
.collapsible.collapsed .coll-body{display:none}
.tile{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 90%,var(--bg)));border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;cursor:pointer;transition:.22s cubic-bezier(.2,.8,.3,1.3);box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.6);position:relative}
.tile:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--sh-lg)}
.tile:active{transform:scale(.95)}
.tile .em{width:58px;height:58px;margin:0 auto 9px;border-radius:16px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,var(--surface3),var(--bg2));box-shadow:inset 0 2px 6px rgba(16,24,40,.1),0 3px 6px -2px rgba(16,24,40,.15);overflow:hidden}
.tile .em img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.tile b{font-size:13px;display:block;margin-bottom:3px}
.tile .pr{color:var(--primary);font-weight:800;font-size:13.5px}
.tile .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.tile.out{opacity:.55;pointer-events:none}
.stock-tag{position:absolute;top:8px;inset-inline-start:8px;font-size:9.5px;font-weight:800;padding:3.5px 9px;border-radius:99px;color:#fff;box-shadow:0 3px 8px rgba(2,8,23,.25)}
.stock-tag.low{background:linear-gradient(135deg,#f59e0b,#d97706)}
.stock-tag.out{background:linear-gradient(135deg,#f05252,#c81e1e)}
.pos-tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pos-tools .search-wrap{flex:1;max-width:none}
.flyball{position:fixed;z-index:400;font-size:30px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(2,8,23,.4))}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{35%{transform:scale(1.22) rotate(-6deg)}}
.cart-drop{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#14c586,var(--primary2));display:grid;place-items:center;font-size:18px;box-shadow:var(--glow),inset 0 2px 0 rgba(255,255,255,.3);transform:perspective(200px) rotateX(10deg)}
.cart{position:sticky;top:86px}
.cart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.cart-head h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.cust-row{display:flex;gap:8px;align-items:stretch;margin-top:7px}
.cust-row select{flex:1}
.prof-btn{width:44px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:18px;box-shadow:var(--sh-sm);transition:.2s}
.prof-btn:active{transform:scale(.92)}
.cart-items{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0;min-height:70px}
.ci{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:9px 11px;animation:pop .25s}
.ci b{font-size:12.5px;flex:1}
.ci-img{width:22px;height:22px;border-radius:6px;object-fit:cover;vertical-align:-5px}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:26px;height:26px;border-radius:9px;background:var(--surface);box-shadow:var(--sh-sm),inset 0 1px 0 rgba(255,255,255,.5);font-weight:900;font-size:15px;color:var(--primary);transition:.15s}
.qty button:active{transform:scale(.85)}
.qty input{width:52px;text-align:center;padding:4px 2px;border-radius:7px;font-weight:800;font-size:13px}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:13px}
.ci .rm{color:var(--danger);background:none;box-shadow:none;font-size:15px;width:26px}
.ci .lp{font-weight:800;min-width:74px;text-align:left;font-size:12px}
.ci .lp s{color:var(--muted);font-weight:500;font-size:10.5px;display:block}
.holds{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.hold-chip{flex-shrink:0;display:flex;align-items:center;gap:9px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:8px 11px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.2s;color:var(--text)}
.hold-chip:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.hold-chip .x{background:var(--danger);color:#fff;border-radius:7px;width:19px;height:19px;display:grid;place-items:center;font-size:10px}
.disc-box{background:var(--surface2);border:1.5px dashed var(--line);border-radius:14px;padding:11px;margin:10px 0}
.disc-row{display:flex;gap:7px}
.disc-row select,.disc-row input{padding:9px 10px;font-size:12.5px}
.disc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:#b45309;border-radius:99px;padding:4px 6px 4px 11px;font-size:11px;font-weight:800}
.dchip button{background:var(--danger);color:#fff;border-radius:99px;width:17px;height:17px;font-size:10px;display:grid;place-items:center}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.pay-grid .btn{width:100%;font-size:12.5px;padding:12px 6px}
.trow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted)}
.trow.big{font-size:16px;font-weight:900;color:var(--text);border-top:2px dashed var(--line);margin-top:7px;padding-top:10px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:15px;margin-bottom:18px}
.stat{display:flex;gap:13px;align-items:center;padding:17px;transition:.25s}
.stat:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.stat .ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:24px;transform:perspective(200px) rotateX(10deg);box-shadow:0 8px 16px -4px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.stat b{font-size:19px;display:block}.stat small{color:var(--muted);font-size:11.5px;font-weight:600}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:15px}
.chart{display:flex;align-items:flex-end;gap:7px;height:190px;padding:16px 4px 0}
.bar{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#14c586,var(--primary2));min-height:3px;position:relative;transition:.3s;box-shadow:0 4px 10px -3px rgba(14,163,113,.5)}
.bar:hover{filter:brightness(1.15)}
.bar .tip{position:absolute;bottom:calc(100% + 7px);right:50%;transform:translateX(50%);background:var(--nav);color:#fff;font-size:10px;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh-md)}
.bar:hover .tip{opacity:1}
.hours{display:flex;gap:7px;padding:7px 4px 0}
.hours span{flex:1;text-align:center;font-size:9.5px;color:var(--muted)}
.cat-bd{margin-bottom:12px}
.cat-bd .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:5px}
.cat-bd .track{height:10px;border-radius:99px;background:var(--surface3);overflow:hidden}
.cat-bd .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary2))}
.rank{display:flex;flex-direction:column;gap:9px}
.rank-item{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--surface2);border-radius:13px;border:1px solid var(--line)}
.rank-item .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.rank-item:nth-child(1) .n{background:linear-gradient(135deg,#fbbf24,#d97706)}
.rank-item:nth-child(2) .n{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
.rank-item:nth-child(3) .n{background:linear-gradient(135deg,#fb923c,#c2570c)}
.rank-item b{font-size:13px;flex:1}.rank-item small{color:var(--primary);font-weight:800;font-size:12px}
.sale-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.sale-row:last-child{border:none}
.sale-row .t{font-weight:800;flex:1;min-width:110px}
.exp-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
.exp-row select{width:auto}
.credit-age{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.credit-age>div{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.credit-age>div b{display:block;font-size:12.5px;color:var(--text);margin-bottom:3px}
.cust-display{position:fixed;inset:0;background:linear-gradient(160deg,#0f1b33,#16294d);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.cust-display.open{display:flex}
.cust-display .cd-item{font-size:22px;color:#cbd5e1;min-height:32px;margin-bottom:8px}
.cust-display .cd-label{color:#8fa3c8;font-size:16px}
.cust-display .cd-total{font-size:64px;font-weight:900;color:#34d399;margin:12px 0;text-shadow:0 8px 30px rgba(52,211,153,.35)}
.cust-display .cd-count{color:#cbd5e1;font-size:17px}
.cust-display .cd-close{margin-top:34px;background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;padding:11px;color:var(--muted);font-size:11.5px;border-bottom:2px solid var(--line)}
.tbl td{padding:12px 11px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:var(--surface2)}
.tbl tr.sel-row td{background:var(--primary-soft)}
.dim-row{opacity:.38;filter:grayscale(.5)}
.thumb{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;background:var(--surface3);vertical-align:middle;font-size:18px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.p-head h2{font-size:17px;font-weight:800}
.badge{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;display:inline-block}
.b-green{background:var(--primary-soft);color:var(--primary)}
.b-amber{background:var(--accent-soft);color:#b45309}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-blue{background:var(--info-soft);color:var(--info)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.perm{display:inline-block;background:var(--surface3);border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:10.5px;margin:2px;font-weight:700;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 14px -4px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3);transform:perspective(200px) rotateX(8deg)}
.avatar.xl{width:74px;height:74px;font-size:34px;border-radius:22px}
.img-pick{display:flex;gap:10px;align-items:center}
.img-prev{width:64px;height:64px;border-radius:14px;background:var(--surface3);display:grid;place-items:center;font-size:28px;overflow:hidden;border:1.5px dashed var(--line);flex-shrink:0}
.img-prev img{width:100%;height:100%;object-fit:cover}
.tgl{position:relative;width:42px;height:23px;display:inline-block;vertical-align:middle}
.tgl input{opacity:0;width:0;height:0}
.tgl .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
[data-theme="dark"] .tgl .sl{background:#334155}
.tgl .sl:before{content:'';position:absolute;width:17px;height:17px;border-radius:99px;background:#fff;top:3px;inset-inline-start:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tgl input:checked + .sl{background:var(--primary)}
.tgl input:checked + .sl:before{inset-inline-start:22px}
#mShare{z-index:200}
.cscreen{position:fixed;inset:0;background:var(--bg);z-index:85;overflow:auto;display:none;animation:pop .3s}
.cscreen.open{display:block}
.cs-head{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(2,8,23,.35)}
.cs-head .nm{font-size:20px;font-weight:900;display:block}
.cs-head .ph{font-size:12.5px;color:#9fb2d6}
.cs-body{max-width:1000px;margin:20px auto;padding:0 18px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.cs-body{grid-template-columns:1fr}}
.led-btns{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.led-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:16px;font-weight:800;font-size:13.5px;color:#fff;transition:.22s;box-shadow:0 6px 0 rgba(0,0,0,.28),var(--sh-md)}
.led-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.led-btn.in{background:linear-gradient(180deg,#14c586,var(--primary2))}
.led-btn.out{background:linear-gradient(180deg,#f87171,#c81e1e)}
.tx-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.tx-row:last-child{border:none}
.pf-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px;gap:8px;flex-wrap:wrap}
.pf-row:last-child{border:none}
.overlay{position:fixed;inset:0;background:rgba(8,15,30,.55);backdrop-filter:blur(5px);display:none;place-items:center;z-index:100;padding:16px}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:22px;box-shadow:var(--sh-lg),inset 0 1px 0 rgba(255,255,255,.4);width:100%;max-width:470px;max-height:92vh;overflow:auto;animation:mPop .32s cubic-bezier(.2,.9,.3,1.25);padding:22px}
@keyframes mPop{from{opacity:0;transform:translateY(30px) scale(.92)}}
.modal h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-row{display:flex;gap:10px}.m-row>div{flex:1}
.m-actions{display:flex;gap:10px;margin-top:20px}.m-actions .btn{flex:1}
.ck-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ck{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--line);padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
.ck:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary2)}
.ck input{width:auto;accent-color:var(--primary)}
.cam-box{position:relative;border-radius:16px;overflow:hidden;background:#0f172a;margin-top:10px;display:none;box-shadow:var(--sh-md)}
.cam-box video{width:100%;display:block}
.cam-line{position:absolute;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,#34d399,transparent);box-shadow:0 0 16px 3px rgba(52,211,153,.8);animation:scanv 1.6s ease-in-out infinite}
@keyframes scanv{0%,100%{top:14%}50%{top:84%}}
.bt-box{border:2px dashed var(--info);background:var(--info-soft);color:var(--info);text-align:center}
.scan-status{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:16px}
.ref-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.ref-opt{border:2px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;cursor:pointer;font-weight:800;font-size:12.5px;transition:.2s;background:var(--surface2)}
.ref-opt small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:4px}
.ref-opt.sel{border-color:var(--danger);background:var(--danger-soft);box-shadow:0 0 0 4px rgba(224,36,36,.12);transform:translateY(-2px)}
.ref-item{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.ref-item b{flex:1}
.ref-item input{width:70px;text-align:center;padding:7px}
.sw-user{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;border:1.5px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.2s;background:var(--surface2)}
.sw-user:hover{border-color:var(--primary);transform:translateX(-3px)}
.sw-user.cur{border-color:var(--primary);background:var(--primary-soft)}
.sw-user b{font-size:13px;display:block}.sw-user small{font-size:11px;color:var(--muted)}
.lock-users{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}
.lock-user{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:15px;background:var(--surface2);border:1.5px solid var(--line);cursor:pointer;width:96px;transition:.2s}
.lock-user:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--sh-md)}
.lock-user small{font-size:9.5px;color:var(--muted);font-weight:700}
.lock-user b{font-size:11.5px;text-align:center}
.pin-dots{display:flex;gap:9px;justify-content:center;margin:14px 0}
.pin-dots span{width:15px;height:15px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);transition:.15s}
.pin-dots span.on{background:var(--primary);border-color:var(--primary);box-shadow:0 0 8px rgba(14,163,113,.5)}
.pin-dots.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.key{height:52px;border-radius:15px;background:linear-gradient(180deg,var(--surface),var(--surface3));box-shadow:0 4px 0 var(--line),var(--sh-sm);font-size:19px;font-weight:900;color:var(--text);transition:.13s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key-go{background:linear-gradient(180deg,#14c586,var(--primary2));color:#fff;box-shadow:0 4px 0 #045c40,var(--glow);grid-column:1/-1;height:46px;font-size:16px}
.paper{background:#fff;color:#111;border-radius:14px;padding:20px;font-size:12.5px;box-shadow:inset 0 0 0 1px #e5e7eb,0 10px 24px -8px rgba(0,0,0,.25);margin-top:12px}
.paper h4{text-align:center;font-size:16px;margin-bottom:2px}
.paper .sub{text-align:center;color:#6b7280;font-size:11px;margin-bottom:10px}
.paper hr{border:none;border-top:1.5px dashed #d1d5db;margin:9px 0}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{padding:4px 3px;font-size:11.5px}
.paper .tot{font-weight:900;font-size:14px}
.paper.thermal{width:80mm;margin:12px auto 0;padding:13px 10px;font-size:11px;line-height:1.55;border-radius:6px}
.paper.thermal table td{padding:2.5px 0;font-size:10.5px}
.paper.thermal .dash{border-top:1px dashed #9ca3af;margin:6px 0}
.mode-tgl{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mode-tgl small{color:var(--muted);font-weight:700;font-size:11px}
.scanner{width:230px;height:230px;margin:18px auto;border-radius:24px;border:3px solid var(--primary);position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a,#1e293b);box-shadow:0 0 0 6px rgba(14,163,113,.15),var(--sh-lg)}
.scanner::before{content:'';position:absolute;inset:18px;border-radius:14px;border:2px dashed rgba(52,211,153,.4)}
.scanline{position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,#34d399,transparent);box-shadow:0 0 18px 4px rgba(52,211,153,.7);animation:scanv 1.8s ease-in-out infinite}
#toasts{position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:500;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--nav);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--sh-lg);animation:tIn .35s cubic-bezier(.2,.9,.3,1.3);display:flex;gap:8px;align-items:center}
.toast.err{background:linear-gradient(135deg,#e02424,#b91c1c)}
.toast.ok{background:linear-gradient(135deg,#0ea371,#047857)}
@keyframes tIn{from{opacity:0;transform:translateY(24px) scale(.9)}}
.mnav{display:none;position:fixed;bottom:0;right:0;left:0;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(16,24,40,.1)}
.mnav button{flex:1;background:none;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:9.5px;font-weight:700;color:var(--muted);padding:6px 1px;border-radius:12px}
.mnav button .i{font-size:19px}
.mnav button.active{color:var(--primary);background:var(--primary-soft)}
@media(max-width:1080px){
  .sidebar{display:none}
  .mnav{display:flex}
  main{padding-bottom:76px}
  .pos-grid{grid-template-columns:1fr}
  .cart{position:fixed;top:0;left:0;bottom:0;width:min(390px,94vw);z-index:90;transform:translateX(-105%);transition:.32s cubic-bezier(.3,.9,.3,1);border-radius:0 22px 22px 0;overflow:auto;background:var(--surface);box-shadow:var(--sh-lg);padding:18px}
  .cart.open{transform:none}
  .cart #cartClose{display:inline-flex}
  .dash-grid{grid-template-columns:1fr}
  .topbar h1 small{display:none}
}
#cartClose{display:none}
[dir="ltr"] .ci .lp{text-align:right}
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body *{visibility:hidden}
  body:not(.printing-report) #printPaper,body:not(.printing-report) #printPaper *{visibility:visible}
  body:not(.printing-report) #printPaper{position:absolute;inset:0}
  body.printing-report #app,body.printing-report .mnav,body.printing-report .overlay,body.printing-report .cscreen,body.printing-report #toasts,body.printing-report .cust-display{display:none!important}
  body.printing-report #printArea,body.printing-report #printArea *{visibility:visible}
  body.printing-report #printArea{display:block;position:absolute;top:0;inset-inline:0}
  #printArea{font-size:12px;color:#111}
  #printArea .rpt-banner{background:#0f1b33;color:#fff;padding:15px 20px;border-radius:12px;font-size:19px;font-weight:900;page-break-after:avoid;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  #printArea .rpt-banner small{font-size:11px;font-weight:500;color:#cbd5e1;display:block;margin-top:3px}
  #printArea .rpt-kpis{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 18px;page-break-after:avoid}
  #printArea .rpt-kpi{border:1.5px solid #e2e8f0;border-radius:11px;padding:9px 15px;min-width:118px;background:#f8fafc}
  #printArea .rpt-kpi b{display:block;font-size:14px;color:#0f172a}
  #printArea .rpt-kpi small{color:#64748b;font-size:10px;font-weight:700}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea thead{display:table-header-group}
  #printArea th{background:#0f1b33!important;color:#fff;padding:10px 8px;font-size:11px;font-weight:800;text-align:start}
  #printArea td{padding:10px 8px;border-bottom:1px solid #e2e8f0;line-height:1.8}
  #printArea tbody tr{page-break-inside:avoid;break-inside:avoid}
  #printArea tbody tr:nth-child(even) td{background:#f8fafc}
  #printArea .rpt-tot{margin-top:16px;padding-top:10px;border-top:2.5px solid #0f1b33;display:flex;gap:20px;justify-content:flex-end;font-weight:900;font-size:13px;flex-wrap:wrap;page-break-inside:avoid}
  #printArea .rpt-foot{margin-top:26px;text-align:center;color:#94a3b8;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-cube">🧮</div><div><b><span data-i18n="app_name"></span> <span style="color:#34d399">POS</span></b><small data-i18n="tagline"></small></div></div>
    <button class="nav-item active" data-page="pos" onclick="go('pos')">🛒 <span data-i18n="nav_pos"></span></button>
    <button class="nav-item" data-page="dashboard" onclick="go('dashboard')">📊 <span data-i18n="nav_dash"></span></button>
    <button class="nav-item" data-page="products" onclick="go('products')">📦 <span data-i18n="nav_prod"></span></button>
    <button class="nav-item" data-page="customers" onclick="go('customers')">👥 <span data-i18n="nav_cust"></span></button>
    <button class="nav-item" data-page="expenses" onclick="go('expenses')">💰 <span data-i18n="nav_expenses"></span></button>
    <button class="nav-item" data-page="users" onclick="go('users')">🔐 <span data-i18n="nav_users"></span></button>
    <div class="side-foot">
      <div class="reg-box"><small data-i18n="register"></small><b id="sideReg">۰</b><span class="sh" id="sideShift"></span></div>
      <div class="user-chip" onclick="openSwitch()">
        <div class="av">👨‍💼</div>
        <div><b id="chipUser">—</b><small id="chipRole">—</small></div>
        <span class="sw">🔁</span>
      </div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="pageTitle">—</h1>
      <div style="flex:1"></div>
      <span class="chip b-green" style="box-shadow:var(--sh-sm)">📷 <span data-i18n="reg_short"></span>: <b id="topReg">۰</b></span>
      <select class="lang-sel" id="langSel" onchange="setLang(this.value)">
        <option value="fa">🇦🇫 دری</option><option value="ps">🇦🇫 پښتو</option><option value="en">🇬🇧 English</option>
      </select>
      <button class="icon-btn" onclick="openCustDisplay()" title="Customer display">🖥️</button>
      <button class="icon-btn" id="xBtn" onclick="printXReport()" title="X Report">📄</button>
      <button class="icon-btn" id="zBtn" onclick="openShiftModal()" title="Z Report">🖨️</button>
      <button class="icon-btn" onclick="openSwitch()">🧑‍💼</button>
      <button class="icon-btn" onclick="openLock('pick')" title="Lock">🔒</button>
      <button class="icon-btn" onclick="toggleTheme()">🔆</button>
      <button class="icon-btn cart-btn" id="cartFab" onclick="toggleCart(true)">🛒<span class="cart-badge" id="cartBadge">۰</span></button>
    </header>
    <section class="page active" id="page-pos">
      <div class="pos-grid">
        <div>
          <div class="pos-tools">
            <div class="search-wrap"><span class="ic">🔍</span><input id="posSearch" data-i18n-ph="search_ph" oninput="renderTiles()"></div>
            <input id="barcodeIn" data-i18n-ph="barcode_ph" style="max-width:160px" onkeydown="if(event.key==='Enter')scanInput(this)">
            <button class="btn btn-3d" onclick="openScanner()"><span data-i18n="scan"></span></button>
          </div>
          <div class="collapsible" id="salesCatBox">
            <div class="coll-head" onclick="toggleColl('salesCatBox')">
              <span class="coll-title">🗂️ <span data-i18n="subcategory"></span></span>
              <span class="coll-arrow">▲</span>
            </div>
            <div class="coll-body"><div class="biz-bar" id="salesCatBar"></div></div>
          </div>
          <div class="prod-grid" id="prodGrid"></div>
        </div>
        <aside class="card cart" id="cartPanel">
          <div class="cart-head">
            <h3><div class="cart-drop" id="cartDrop">🛒</div><span data-i18n="cart"></span> (<span id="cartCount">۰</span>)</h3>
            <div style="display:flex;gap:7px">
              <button class="btn btn-sm btn-amber" onclick="holdOrder()"><span data-i18n="hold_order"></span> <span id="holdN" class="chip b-amber" style="display:none">۰</span></button>
              <button class="btn btn-sm btn-ghost" id="cartClose" onclick="toggleCart(false)">✕</button>
            </div>
          </div>
          <div id="holdsBox" style="display:none"><label style="margin-top:0" data-i18n="held_orders"></label><div class="holds" id="holdsList"></div></div>
          <label data-i18n="customer"></label>
          <input id="custSearch" data-i18n-ph="cust_search_ph" style="padding:9px 12px;font-size:12.5px" oninput="renderCart()">
          <div class="cust-row">
            <select id="custSel" onchange="pickCust(this.value)"></select>
            <button class="prof-btn" onclick="openClientScreen(DB.custId)">👤</button>
          </div>
          <input id="walkName" data-i18n-ph="walkin_ph" style="display:none;margin-top:7px;padding:9px 12px;font-size:12.5px">
          <div class="cart-items" id="cartItems"></div>
          <div class="disc-box" id="discWrap" style="display:none">
            <label style="margin-top:0" data-i18n="add_discount"></label>
            <div class="disc-row">
              <select id="dTarget"></select>
              <select id="dMode" style="max-width:110px"><option value="pct" data-i18n="percent"></option><option value="amt" data-i18n="amount_f"></option></select>
              <input type="number" step="any" id="dValue" min="0" data-i18n-ph="value_ph">
              <button class="btn btn-sm btn-3d" onclick="addDisc()">＋</button>
            </div>
            <div class="disc-chips" id="discChips"></div>
          </div>
          <div class="trow"><span data-i18n="subtotal"></span><b id="subT">—</b></div>
          <div class="trow"><span data-i18n="discounts"></span><b id="discT" style="color:var(--danger)">—</b></div>
          <div class="trow big"><span data-i18n="payable"></span><b id="totT" style="color:var(--primary)">—</b></div>
          <div class="pay-grid">
            <button class="btn btn-3d" onclick="startPay('cash')" data-i18n="p_cash"></button>
            <button class="btn btn-amber" onclick="startPay('half')" data-i18n="p_half"></button>
            <button class="btn" onclick="startPay('custom')" data-i18n="p_custom"></button>
            <button class="btn btn-ghost" onclick="startPay('credit')" data-i18n="p_credit"></button>
          </div>
          <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="clearCart()" data-i18n="clear_cart"></button>
        </aside>
      </div>
    </section>
    <section class="page" id="page-dashboard">
      <div class="stats" id="statCards"></div>
      <div class="card" id="stockAlertCard" style="margin-bottom:15px"></div>
      <div class="card" id="expiryAlertCard" style="margin-bottom:15px"></div>
      <div class="card" style="margin-bottom:15px"><h3 style="font-size:15px;margin-bottom:8px">📦 <span data-i18n="reorder"></span></h3><div id="reorderList"></div></div>
      <div class="dash-grid">
        <div class="card"><h3 style="font-size:15px;margin-bottom:4px" data-i18n="hourly"></h3><div class="chart" id="chart"></div><div class="hours" id="hours"></div></div>
        <div style="display:flex;flex-direction:column;gap:15px">
          <div class="card"><h3 style="font-size:15px;margin-bottom:11px" data-i18n="best_sellers"></h3><div class="rank" id="sellers"></div></div>
          <div class="card"><h3 style="font-size:15px;margin-bottom:11px" data-i18n="top_products"></h3><div class="rank" id="topProds"></div></div>
          <div class="card"><h3 style="font-size:15px;margin-bottom:11px" data-i18n="cat_breakdown"></h3><div id="catBreakdown"></div></div>
        </div>

  const list=DB.customers.filter(c=>!q||c.name.includes(q)||(c.phone||'').includes(q));
  $('custSel').innerHTML=list.map(c=>`<option value="${c.id}" ${c.id===DB.custId?'selected':''}>${c.id===1?t('walkin'):('👤 '+esc(c.name)+(c.balance>0?' — '+t('debt')+': '+fmt(c.balance):''))}</option>`).join('');
  if(!list.find(c=>c.id===DB.custId)){const c=C(DB.custId);if(c)$('custSel').insertAdjacentHTML('beforeend',`<option value="${c.id}" selected>${c.id===1?t('walkin'):'👤 '+esc(c.name)}</option>`);}
  $('walkName').style.display=DB.custId===1?'block':'none';
  if(DB.custId!==1)$('walkName').value='';

  $('cartItems').innerHTML=DB.cart.map(c=>{const p=P(c.id);const g=p.price*c.qty,n=Math.round(lineNet(c));

      <div class="qty"><button onclick="chQty(${c.id},1)">+</button><input class="qty-in" type="number" step="any" min="0" value="${c.qty}" onchange="setQty(${c.id},this.value)"><button onclick="chQty(${c.id},-1)">−</button><button class="rm" onclick="chQty(${c.id},-999)">🗑</button></div>
      <div class="lp">${n!==g?`<s>${af(g)}</s>`:''}${af(n)}</div></div>`;}).join('')||`<div class="empty">${t('empty_cart')}</div>`;
  const cc=cartCalc();
  $('subT').textContent=af(cc.gross);$('discT').textContent='− '+af(cc.discTotal);$('totT').textContent=af(cc.total);
  const n=DB.cart.reduce((s,c)=>s+c.qty,0);

function holdOrder(){

function recallHold(hid){
  const h=DB.holds.find(x=>x.id===hid);if(!h)return;
  if(DB.cart.length){DB.holds.push({id:uid(),custId:DB.custId,items:DB.cart,discs:DB.discounts,time:Date.now()});toast(t('swapped'));}
  DB.cart=h.items;DB.discounts=h.discs||[];DB.custId=h.custId;
  DB.holds=DB.holds.filter(x=>x.id!==hid);

function lineNet(c){const p=P(c.id);if(!p)return 0;let amt=p.price*c.qty;
  for(const d of DB.discounts){if(d.scope==='item'&&d.itemId===c.id){amt=d.mode==='pct'?amt*(1-d.value/100):amt-d.value;if(amt<0)amt=0;}}
  return amt;}
function cartCalc(){let sub=0,itemDisc=0;
  for(const c of DB.cart){const p=P(c.id);const g=p.price*c.qty;const n=lineNet(c);sub+=n;itemDisc+=g-n;}
  let amt=sub,cartDisc=0;
  for(const d of DB.discounts){if(d.scope==='cart'){const b=amt;amt=d.mode==='pct'?amt*(1-d.value/100):amt-d.value;if(amt<0)amt=0;cartDisc+=b-amt;}}
  return {gross:sub+itemDisc,discTotal:itemDisc+cartDisc,total:Math.round(amt)};}
const cartTotal=()=>cartCalc().total;
function addDisc(){
  if(!can('تخفیف'))return;

  if(!v||v<=0){toast(t('disc_val'),false);return;}
  if(mode==='pct'&&v>100){toast(t('pct100'),false);return;}
  if(tg.startsWith('item:'))DB.discounts.push({scope:'item',itemId:+tg.slice(5),mode:mode,value:v});
  else DB.discounts.push({scope:'cart',mode:mode,value:v});

function buildReceiptText(s){
  const u=DB.users.find(x=>x.id===s.userId);
  let txt=`🧮 ${t('store')}\n============================\n`;
  txt+=`${t('invoice')}: #${s.id.slice(0,5).toUpperCase()}\n${dStr(s.time)} ${tmr(s.time)}\n`;
  txt+=`${t('customer')}: ${saleCustName(s)}\n${t('seller')}: ${u?u.name:'—'}\n============================\n`;
  s.items.forEach(i=>{txt+=`${i.name} ×${i.qty} = ${af(i.price*i.qty)}\n`;});
  txt+='============================\n';
  if(s.disc>0)txt+=`${t('discounts')}: -${af(s.disc)}\n`;
  txt+=`${t('total_t')}: ${af(s.total)}\n${t('received_t')} (${typeTr(s.type)}): ${af(s.paid)}\n`;
  if(s.total-s.paid>0)txt+=`${t('credit_t')}: ${af(s.total-s.paid)}\n`;
  if(s.paid>s.total)txt+=`${t('change_t')}: ${af(s.paid-s.total)}\n`;
  txt+=`============================\n${t('thanks')}`;
  return txt;}
async function loadHtml2Canvas(){
  if(window.html2canvas)return true;
  const urls=['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'];
  for(const src of urls){try{await loadScript(src);if(window.html2canvas)return true;}catch(e){}}
  return false;}
async function openShare(saleId){
  const s=DB.sales.find(x=>x.id===saleId);if(!s)return;
  window._shareText=buildReceiptText(s);
  window._shareBlob=null;
  $('mShare').classList.add('open');
  const prev=$('sharePreview');
  if(prev)prev.innerHTML='<span style="color:var(--muted);font-size:12px">…</span>';
  try{
    if(await loadHtml2Canvas()){
      const tmp=document.createElement('div');
      tmp.style.cssText='position:absolute;left:-9999px;top:0;width:340px;background:#ffffff;padding:16px;';
      tmp.setAttribute('dir',LANG==='en'?'ltr':'rtl');
      tmp.innerHTML=receiptNormal(s);
      document.body.appendChild(tmp);
      const canvas=await window.html2canvas(tmp,{backgroundColor:'#ffffff',scale:2});
      document.body.removeChild(tmp);
      const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
      window._shareBlob=blob;
      if(prev&&blob){prev.innerHTML=`<img src="${canvas.toDataURL()}" style="max-width:100%;max-height:280px;border-radius:10px;border:1px solid var(--line)">`;}
    }else if(prev){prev.innerHTML='<span style="color:var(--muted)">📄</span>';}
  }catch(e){console.warn('img render failed',e);window._shareBlob=null;if(prev)prev.innerHTML='<span style="color:var(--muted)">📄</span>';}
}

async function shareVia(app){
  const txt=window._shareText||'';
  const blob=window._shareBlob;
  if(blob&&navigator.canShare){
    try{
      const file=new File([blob],'hesabiman-receipt.png',{type:'image/png'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:t('receipt_t')});
        closeM('mShare');return;
      }
    }catch(e){console.warn('share sheet failed',e);}
  }
  if(blob){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='hesabiman-receipt.png';
    document.body.appendChild(a);a.click();a.remove();
  }
  const enc=encodeURIComponent(txt);
  if(app==='whatsapp')window.open('https://wa.me/?text='+enc,'_blank');
  else if(app==='telegram')window.open('https://t.me/share/url?url=&text='+enc,'_blank');
  else if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))).catch(()=>{});}
  closeM('mShare');}

  const total=cartTotal();
  if(ty==='credit'&&DB.custId===1){toast(t('need_cust'),false);return;}

  if(r>total&&payType==='half')r=total;

function finalize(paid,type){
  ensureShiftForToday();
  const cc=cartCalc();
  const items=DB.cart.map(c=>{const p=P(c.id);return {id:p.id,name:p.name,price:p.price,cost:p.cost,qty:c.qty,unit:p.unit};});
  const cost=items.reduce((s,x)=>s+x.cost*x.qty,0);
  const credit=cc.total-paid;
  const wn=($('walkName')?$('walkName').value.trim():'');
  const walkNameSave=(DB.custId===1&&wn)?wn:'';
  if(credit>0){
    const c=C(DB.custId);
    if(c&&c.limit>0&&(c.balance+credit)>c.limit){toast(t('limit_exceeded'),false);return;}

function pickImg(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=240;let w=img.width,h=img.height;
      const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      pmImg=cv.toDataURL('image/jpeg',.82);
      $('pmImgPrev').innerHTML=`<img src="${pmImg}">`;};
    img.src=e.target.result;};
  rd.readAsDataURL(f);
  inp.value='';}

function loadJsBarcode(){
  return new Promise((res,rej)=>{
    if(window.JsBarcode)return res();
    const urls=['https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js'];
    const tryLoad=i=>{
      if(i>=urls.length)return rej();
      const s=document.createElement('script');s.src=urls[i];
      s.onload=()=>window.JsBarcode?res():tryLoad(i+1);
      s.onerror=()=>tryLoad(i+1);
      document.head.appendChild(s);};
    tryLoad(0);});}

  $('pmSubcatCustom').value=p?(p.subcatName||''):'';
  $('pmSubcatCustom').style.display=$('pmSubcat').value==='sc_other'?'block':'none';
  $('pmBar').value=p?p.barcode:'';
  pmImg=p?(p.img||''):'';$('pmImgPrev').innerHTML=pmImg?`<img src="${pmImg}">`:'📦';
  $('bcStatus').textContent='';stopCamScan();
  updateCalcCost();
  $('mProduct').classList.add('open');}
function saveProduct(){
  const name=$('pmName').value.trim(),price=+$('pmPrice').value||0;
  if(!name){toast(t('name_req2'),false);return;}
  const existed=editId?P(editId):null;
  const catVal=$('pmCat').value;
  const catName2=catVal==='other'?($('pmCatCustom').value.trim()||'other'):'';
  const finalCat=catVal==='other'?'other':catVal;
  const subVal=$('pmSubcat').value;
  const subName2=subVal==='sc_other'?($('pmSubcatCustom').value.trim()||'sc_other'):'';
  const finalSub=subVal==='sc_other'?'sc_other':subVal;
  const buyUnitSel=$('pmBuyUnit').value;
  const buyUnit=buyUnitSel==='دیگر'?($('pmBuyUnitCustom').value.trim()||'دیگر'):buyUnitSel;
  const buyUnitQty=+$('pmBuyUnitQty').value||1;
  const buyUnitPrice=+$('pmBuyUnitPrice').value||0;
  var cost;
  if(buyUnitQty>0&&buyUnitPrice>0){cost=buyUnitPrice/buyUnitQty;}
  else{cost=existed?existed.cost:0;}
  const unitSel=$('pmUnit').value;
  const unit=unitSel==='دیگر'?($('pmUnitCustom').value.trim()||'دیگر'):unitSel;
  const ex=$('pmExpiry').value;
  const data={name:name,price:price,cost:cost,unit:unit,stock:+($('pmStock').value||0),
    buyUnit:buyUnit,buyUnitQty:buyUnitQty,buyUnitPrice:buyUnitPrice,
    cat:finalCat,catName:catName2,subcat:finalSub,subcatName:subName2,img:pmImg||'',
    expiry:ex?new Date(ex+'T23:59:59').getTime():null,
    barcode:$('pmBar').value.trim()||('899'+Math.floor(100000+Math.random()*899999)),icon:existed?existed.icon:'📦',active:existed?(existed.active!==false):true};
  if(editId){Object.assign(P(editId),data);toast(t('saved'));}
  else{DB.products.push({id:Math.max(0,...DB.products.map(p=>p.id))+1,...data});toast(t('saved'));}
  save();stopCamScan();closeM('mProduct');renderProducts();renderTiles();
  if(curPage==='dashboard')renderDash();}
function delProduct(id){if(!confirm(t('confirm_del')))return;DB.products=DB.products.filter(p=>p.id!==id);DB.cart=DB.cart.filter(c=>c.id!==id);DB.discounts=DB.discounts.filter(d=>d.itemId!==id);save();renderProducts();renderTiles();renderCart();toast(t('deleted'));}
function onBarcodeDetected(code){$('pmBar').value=code;stopCamScan();toast(t('barcode_found')+': '+code);try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}}
async function startCamScan(){
  $('bcStatus').textContent=t('scanning');
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('bcVideo');v.srcObject=camStream;await v.play();$('camBox').style.display='block';
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();
      camTimer=setInterval(async()=>{try{const codes=await det.detect(v);if(codes.length)onBarcodeDetected(codes[0].rawValue);}catch(e){}},280);
    }else await startZXing(v);
  }catch(e){$('bcStatus').textContent=t('no_camera');toast(t('no_camera'),false);}}
function startZXing(v){
  return new Promise(res=>{
    if(window.ZXingBrowser){runZX(v);return res();}
    const s=document.createElement('script');
    s.src='https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
    s.onload=()=>runZX(v);
    s.onerror=()=>{$('bcStatus').textContent=t('scan_unsupported');};
    document.head.appendChild(s);res();});}
function runZX(v){
  try{
    zxReader=new ZXingBrowser.BrowserMultiFormatReader();
    zxReader.decodeFromVideoDevice(undefined,v,(result)=>{if(result)onBarcodeDetected(result.getText());});
  }catch(e){$('bcStatus').textContent=t('scan_unsupported');}}
function stopCamScan(){
  if(camTimer){clearInterval(camTimer);camTimer=null;}
  if(zxReader){try{zxReader.reset();}catch(e){} zxReader=null;}
  if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null;}
  $('camBox').style.display='none';$('bcStatus').textContent='';}
function renderCustomers(){
  $('custGrid').innerHTML=DB.customers.map((c,i)=>{
    const ag=c.balance>0?agingLabel(c.id):null;
    return `
    <div class="card" style="cursor:pointer" onclick="openClientScreen(${c.id})">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
        <div class="avatar" style="background:linear-gradient(135deg,${['#0ea371,#067a55','#2563eb,#1d4ed8','#7c3aed,#6d28d9','#f59e0b,#d97706'][i%4]})">${i===0?'🚶':'🙂'}</div>
        <div style="flex:1"><b style="font-size:14px">${esc(custName(c.id))}</b><div style="font-size:11.5px;color:var(--muted)">📞 ${toFa(c.phone||'—')}</div></div>
      </div>
      ${c.notes?`<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">📝 ${esc(c.notes)}</div>`:''}
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
        ${c.balance>0?`<span class="badge b-red">💳 ${t('debt')}: ${af(c.balance)}</span>`:`<span class="badge b-green">${t('no_debt')}</span>`}
        ${c.limit>0?`<span class="badge b-blue">🛡️ ${af(c.limit)}</span>`:''}
        ${ag?`<span class="badge ${ag.cls}">⏳ ${ag.txt}</span>`:''}
      </div>
      <div style="display:flex;justify-content:flex-end;gap:5px" onclick="event.stopPropagation()">
        ${c.id>0?`<button class="btn btn-sm btn-blue" onclick="openCreditStmt(${c.id})">💳</button>
        <button class="btn btn-sm btn-ghost" onclick="openCustomerModal(${c.id})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="delCustomer(${c.id})">🗑</button>`:''}
      </div>
    </div>`;}).join('');}
let editCust=null;
function openCustomerModal(id){editCust=id||null;$('cmTitle').innerHTML=id?t('edit_customer'):t('add_customer');
  const c=id?C(id):null;$('cmName').value=c?c.name:'';$('cmPhone').value=c?c.phone:'';$('cmLimit').value=c&&c.limit?c.limit:'';$('cmNotes').value=c?c.notes:'';
  $('mCustomer').classList.add('open');}
function saveCustomer(){const name=$('cmName').value.trim();if(!name){toast(t('name_req2'),false);return;}
  const data={name:name,phone:$('cmPhone').value.trim(),notes:$('cmNotes').value.trim(),limit:+($('cmLimit').value||0)};
  if(editCust){Object.assign(C(editCust),data);toast(t('saved'));}
  else{DB.customers.push({id:Math.max(0,...DB.customers.map(c=>c.id))+1,...data,balance:0});toast(t('saved'));}
  save();closeM('mCustomer');renderCustomers();renderCart();}
function delCustomer(id){if(!confirm(t('confirm_del')))return;DB.customers=DB.customers.filter(c=>c.id!==id);if(DB.custId===id)DB.custId=1;save();renderCustomers();renderCart();toast(t('deleted'));}
function scopeBadge(sc){return sc==='full'?`<span class="badge b-purple">${t('scope_full')}</span>`:sc==='posdash'?`<span class="badge b-blue">${t('scope_dash')}</span>`:`<span class="badge b-green">${t('scope_pos')}</span>`;}
function renderUsers(){
  $('userGrid').innerHTML=DB.users.map((u,i)=>`
    <div class="card">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
        <div class="avatar" style="background:linear-gradient(135deg,${['#f59e0b,#d97706','#0ea371,#067a55','#2563eb,#1d4ed8','#7c3aed,#6d28d9'][i%4]})">👤</div>
        <div style="flex:1"><b style="font-size:14px">${esc(u.name)}</b>
        <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap"><span class="badge ${u.role==='مدیر کل'?'b-purple':u.role.includes('مدیر')?'b-blue':'b-green'}">${roleTr(u.role)}</span>${scopeBadge(u.scope||'pos')}${u.pin?'<span class="badge b-amber">🔑 PIN</span>':''}</div></div>
      </div>
      <div style="min-height:30px">${u.perms.length?u.perms.map(p=>`<span class="perm">🔓 ${esc(p)}</span>`).join(''):'<span class="perm">—</span>'}</div>
      <div style="display:flex;gap:7px;margin-top:12px;justify-content:flex-end">
        <button class="btn btn-sm btn-ghost" onclick="openUserModal(${u.id})">✏️</button>
        ${u.id!==DB.userId?`<button class="btn btn-sm btn-danger" onclick="delUser(${u.id})">🗑</button>`:''}
      </div>
    </div>`).join('');}
let editUser=null;
function roleDefault(){if(editUser)return;const r=$('umRole').value;
  const v=r==='مدیر کل'?'full':r.includes('مدیر')?'posdash':'pos';
  document.querySelectorAll('[name=uscope]').forEach(x=>x.checked=x.value===v);}
function openUserModal(id){editUser=id||null;$('umTitle').innerHTML=id?t('edit_user'):t('add_user');
  const u=id?DB.users.find(x=>x.id===id):null;
  $('umName').value=u?u.name:'';$('umRole').value=u?u.role:'صندوقدار';$('umPin').value=u?(u.pin||''):'';
  const sc=u?(u.scope||'pos'):'pos';
  document.querySelectorAll('[name=uscope]').forEach(x=>x.checked=x.value===sc);
  document.querySelectorAll('.uperm').forEach(c=>c.checked=u?u.perms.includes(c.value):false);
  $('mUser').classList.add('open');}
function saveUser(){const name=$('umName').value.trim();if(!name){toast(t('name_req2'),false);return;}
  const perms=[...document.querySelectorAll('.uperm:checked')].map(c=>c.value);
  const scope=(document.querySelector('[name=uscope]:checked')||{}).value||'pos';
  const pin=($('umPin').value||'').replace(/\D/g,'').slice(0,4);
  const data={name:name,role:$('umRole').value,perms:perms,scope:scope,pin:pin};
  if(editUser){Object.assign(DB.users.find(x=>x.id===editUser),data);toast(t('saved'));}
  else{DB.users.push({id:Math.max(0,...DB.users.map(u=>u.id))+1,...data});toast(t('saved'));}
  save();closeM('mUser');renderUsers();applyUser();}
function delUser(id){if(!confirm(t('confirm_del')))return;DB.users=DB.users.filter(u=>u.id!==id);save();renderUsers();toast(t('deleted'));}
(function init(){
  const th=localStorage.getItem('hm_theme');if(th)document.documentElement.dataset.theme=th;
  document.querySelectorAll('input[type="number"]').forEach(i=>i.setAttribute('step','any'));
  applyUser();applyLang();
  openLock('pick');
})();
</script>
</body>
</html>
